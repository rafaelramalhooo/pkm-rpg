name: Extrair dados

on:
  workflow_dispatch:
    inputs:
      range:
        description: "Faixa de Pokémon (ex.: 1-3 para um teste rápido, 1-151 para a Etapa A)"
        default: "1-3"
        required: true
      skip_pokemondb:
        description: "Pular a conferência com o pokemondb (1 = pular)"
        default: "0"
        required: false

permissions:
  contents: write

concurrency:
  group: extrair-dados
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache das respostas já baixadas, para retomar sem repetir requisições
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Extrair
        env:
          EXTRACT_RANGE: ${{ inputs.range }}
          SKIP_POKEMONDB: ${{ inputs.skip_pokemondb }}
        run: node scripts/extract.js

      - name: Guardar os JSONs no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
          else
            git commit -m "Dados extraídos (faixa ${{ inputs.range }})"
            git push
          fi
