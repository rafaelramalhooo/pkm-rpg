name: Publicar site

# Compila o site duas vezes a partir do mesmo código:
#  - produção na raiz (aponta para o Supabase de produção);
#  - teste em /teste/ (aponta para o Supabase de teste).
# URL do projeto e chave publishable são PÚBLICAS por desenho (a segurança vem do RLS).
# Nunca coloque aqui a chave secreta (service_role).
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "public/**"
      - "src/**"
      - "data/*.json"
      - ".github/workflows/publicar-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar mapas (erros bloqueiam a publicação)
        run: node scripts/lint-mapas.mjs

      - name: Compilar produção
        env:
          VITE_BASE: /pkm-rpg/
          VITE_AMBIENTE: producao
          VITE_SUPABASE_URL: https://dnhrtfcutluqsforwhsp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_t4Pm9QpVA_6a1ORBnNtrmg_p8ryApce
        run: npm run build

      - name: Compilar teste
        env:
          VITE_BASE: /pkm-rpg/teste/
          VITE_AMBIENTE: teste
          VITE_SUPABASE_URL: https://uaqccpmxmxxjiypqvgtn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_tdotJ3L8J2UY1VlhoPwFZw_hgTSf5O0
        run: npx vite build --outDir dist-teste

      - name: Montar o site
        run: |
          mkdir -p _site/data _site/teste/data
          cp -r dist/. _site/
          cp -r dist-teste/. _site/teste/
          cp data/*.json _site/data/ 2>/dev/null || true
          cp data/*.json _site/teste/data/ 2>/dev/null || true
          # Nunca publicar o relatório de extração
          rm -f _site/data/extraction-report.json _site/teste/data/extraction-report.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
