name: Manter ativo

# A cada 3 dias chama a função `ping` do banco (uma consulta de verdade) nos dois projetos Supabase,
# para o plano gratuito não pausá-los por inatividade.
# Só usa a URL e a chave publishable, públicas por desenho (as mesmas do site). Nunca coloque aqui
# a chave secreta (service_role).
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: producao
            url: https://dnhrtfcutluqsforwhsp.supabase.co
            key: sb_publishable_t4Pm9QpVA_6a1ORBnNtrmg_p8ryApce
          - nome: teste
            url: https://uaqccpmxmxxjiypqvgtn.supabase.co
            key: sb_publishable_tdotJ3L8J2UY1VlhoPwFZw_hgTSf5O0
    steps:
      - name: Chamar o banco (${{ matrix.nome }})
        env:
          URL: ${{ matrix.url }}
          KEY: ${{ matrix.key }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' \
            "$URL/rest/v1/rpc/ping")
          echo "Resposta: $code"
          test "$code" = "200"
